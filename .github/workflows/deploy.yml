name: CI/CD

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

env:
  GCP_PROJECT_ID: contact-center-insights-poc
  GCP_REGION: us-east1
  SERVICE_NAME: tunnel-server
  IMAGE_NAME: gcr.io/contact-center-insights-poc/tunnel-server

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache-dependency-path: |
          tunnel/server/go.sum
          tunnel/agent/go.sum

    - name: Build server
      run: cd tunnel/server && go build -v .

    - name: Build agent
      run: cd tunnel/agent && go build -v .

    - name: Vet server
      run: cd tunnel/server && go vet ./...

    - name: Vet agent
      run: cd tunnel/agent && go vet ./...

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set deploy target
      id: target
      run: |
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "service_name=${{ env.SERVICE_NAME }}" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
          echo "env=production" >> $GITHUB_OUTPUT
        else
          # Staging service for non-main branches
          echo "service_name=${{ env.SERVICE_NAME }}-staging" >> $GITHUB_OUTPUT
          echo "image_tag=staging" >> $GITHUB_OUTPUT
          echo "env=staging" >> $GITHUB_OUTPUT
        fi

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker --quiet

    - name: Build and Deploy
      run: |
        DEPLOY_SERVICE="${{ steps.target.outputs.service_name }}"
        DEPLOY_TAG="${{ steps.target.outputs.image_tag }}"
        DEPLOY_ENV="${{ steps.target.outputs.env }}"
        DEPLOY_IMAGE="${IMAGE_NAME}:${DEPLOY_TAG}"

        echo "Building and deploying tunnel server to Cloud Run ($DEPLOY_ENV)..."
        echo "Service: $DEPLOY_SERVICE"
        echo "Image:   $DEPLOY_IMAGE"

        # Build from tunnel/server directory (self-contained module)
        BUILD_ID=$(gcloud builds submit --tag $DEPLOY_IMAGE tunnel/server --async --format="value(id)")

        echo "Waiting for build $BUILD_ID to complete..."
        while true; do
          BUILD_STATUS=$(gcloud builds describe $BUILD_ID --format="value(status)")
          if [ "$BUILD_STATUS" = "SUCCESS" ]; then
            echo "Build completed successfully"
            break
          elif [ "$BUILD_STATUS" = "FAILURE" ] || [ "$BUILD_STATUS" = "CANCELLED" ] || [ "$BUILD_STATUS" = "TIMEOUT" ]; then
            echo "Build failed with status: $BUILD_STATUS"
            exit 1
          else
            echo "Build status: $BUILD_STATUS (waiting...)"
            sleep 10
          fi
        done

        # Deploy to Cloud Run
        echo "Deploying to Cloud Run ($DEPLOY_ENV)..."
        URL=$(gcloud run deploy $DEPLOY_SERVICE \
          --image $DEPLOY_IMAGE \
          --platform managed --region $GCP_REGION \
          --allow-unauthenticated --max-instances=1 \
          --timeout=3600 \
          --set-env-vars SERVER_URL=https://connect.vexorium.net \
          --format='value(status.url)')

        echo "Deployment complete! Service URL: $URL"
        echo "SERVICE_URL=$URL" >> $GITHUB_ENV

    - name: Verify Deployment
      run: |
        echo "Verifying deployment health..."
        sleep 10

        HEALTH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/__health__")
        if [ "$HEALTH_RESPONSE" = "200" ]; then
          echo "Health check passed"
        else
          echo "Health check failed (HTTP $HEALTH_RESPONSE)"
          exit 1
        fi

        echo "Service: $SERVICE_URL"
        echo "Health:  $SERVICE_URL/__health__"
