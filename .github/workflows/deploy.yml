name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GCP_PROJECT_ID: contact-center-insights-poc
  GCP_REGION: us-east1
  SERVICE_NAME: tunnel-server
  IMAGE_NAME: gcr.io/contact-center-insights-poc/tunnel-server
  GO_VERSION: '1.24'

jobs:
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for server changes
      uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          server:
            - 'tunnel/server/**'
            - 'tunnel/agent/**'

  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: Build server
      run: cd tunnel/server && go build -o /dev/null .

    - name: Build agent
      run: cd tunnel/agent && go build -o /dev/null .

    - name: Vet server
      run: cd tunnel/server && go vet ./...

    - name: Vet agent
      run: cd tunnel/agent && go vet ./...

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [test, detect-changes]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.detect-changes.outputs.server == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker --quiet

    - name: Build and Deploy
      run: |
        echo "Building and deploying tunnel server to Cloud Run..."

        # Build from tunnel/server directory (self-contained module)
        BUILD_ID=$(gcloud builds submit --tag $IMAGE_NAME tunnel/server --async --format="value(id)")

        echo "Waiting for build $BUILD_ID to complete..."
        while true; do
          BUILD_STATUS=$(gcloud builds describe $BUILD_ID --format="value(status)")
          if [ "$BUILD_STATUS" = "SUCCESS" ]; then
            echo "Build completed successfully"
            break
          elif [ "$BUILD_STATUS" = "FAILURE" ] || [ "$BUILD_STATUS" = "CANCELLED" ] || [ "$BUILD_STATUS" = "TIMEOUT" ]; then
            echo "Build failed with status: $BUILD_STATUS"
            exit 1
          else
            echo "Build status: $BUILD_STATUS (waiting...)"
            sleep 10
          fi
        done

        # Deploy to Cloud Run
        echo "Deploying to Cloud Run..."
        URL=$(gcloud run deploy $SERVICE_NAME \
          --image $IMAGE_NAME \
          --platform managed --region $GCP_REGION \
          --allow-unauthenticated --max-instances=1 \
          --timeout=3600 \
          --set-env-vars SERVER_URL=https://connect.vexorium.net \
          --format='value(status.url)')

        echo "Deployment complete! Service URL: $URL"
        echo "SERVICE_URL=$URL" >> $GITHUB_ENV

    - name: Verify Deployment
      run: |
        echo "Verifying deployment health..."
        sleep 10

        HEALTH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/__health__")
        if [ "$HEALTH_RESPONSE" = "200" ]; then
          echo "Health check passed"
        else
          echo "Health check failed (HTTP $HEALTH_RESPONSE)"
          exit 1
        fi

        echo "Service: $SERVICE_URL"
        echo "Health:  $SERVICE_URL/__health__"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, detect-changes]
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.server == 'true'

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker --quiet

    - name: Deploy to Staging
      run: |
        STAGING_SERVICE="tunnel-server-staging-pr-${{ github.event.number }}"
        STAGING_IMAGE="gcr.io/$GCP_PROJECT_ID/tunnel-server-staging-pr-${{ github.event.number }}"

        echo "Deploying to staging: $STAGING_SERVICE"

        BUILD_ID=$(gcloud builds submit --tag $STAGING_IMAGE tunnel/server --async --format="value(id)")

        echo "Waiting for build $BUILD_ID to complete..."
        while true; do
          BUILD_STATUS=$(gcloud builds describe $BUILD_ID --format="value(status)")
          if [ "$BUILD_STATUS" = "SUCCESS" ]; then
            echo "Build completed successfully"
            break
          elif [ "$BUILD_STATUS" = "FAILURE" ] || [ "$BUILD_STATUS" = "CANCELLED" ] || [ "$BUILD_STATUS" = "TIMEOUT" ]; then
            echo "Build failed with status: $BUILD_STATUS"
            exit 1
          else
            echo "Build status: $BUILD_STATUS (waiting...)"
            sleep 10
          fi
        done

        STAGING_URL=$(gcloud run deploy $STAGING_SERVICE \
          --image $STAGING_IMAGE \
          --platform managed --region $GCP_REGION \
          --allow-unauthenticated --max-instances=1 \
          --set-env-vars SERVER_URL=$STAGING_URL \
          --format='value(status.url)')

        echo "Staging deployment complete! URL: $STAGING_URL"
        echo "STAGING_URL=$STAGING_URL" >> $GITHUB_ENV

    - name: Comment PR with staging URL
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## Staging Deployment Ready\n\n**URL:** ${{ env.STAGING_URL }}\n**Health:** ${{ env.STAGING_URL }}/__health__\n\nStaging service will be cleaned up when the PR is merged or closed.`
          })

  cleanup-staging:
    name: Cleanup Staging
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && github.event_name == 'pull_request'

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Delete staging service
      run: |
        STAGING_SERVICE="tunnel-server-staging-pr-${{ github.event.number }}"

        gcloud run services delete $STAGING_SERVICE \
          --platform managed --region $GCP_REGION \
          --quiet || echo "Service may not exist"

        gcloud artifacts docker images delete \
          gcr.io/$GCP_PROJECT_ID/tunnel-server-staging-pr-${{ github.event.number }} \
          --quiet || echo "Image may not exist"

        echo "Staging environment cleaned up"
