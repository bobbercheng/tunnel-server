name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GCP_PROJECT_ID: contact-center-insights-poc
  GCP_REGION: us-east1
  SERVICE_NAME: tunnel-server
  IMAGE_NAME: gcr.io/contact-center-insights-poc/tunnel-server

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'
        cache-dependency-path: |
          **/go.sum
          **/go.mod
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: go work sync
    
    - name: Run tests
      run: |
        echo "Testing all Go modules..."
        go test ./server/... -v
        go test ./agent/... -v  
        go test ./reverse-proxy-agent/... -v
        go test ./pkg/crypto/... -v
        go test ./pkg/agentlib/... -v
        go test ./pkg/metrics/... -v

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}
    
    - name: Configure Docker for GCR
      run: gcloud auth configure-docker --quiet
    
    - name: Build and Deploy
      run: |
        echo "Building and deploying server to Cloud Run..."
        
        # Copy Dockerfile to root for Cloud Build context (mirrors deploy.sh)
        cp server/Dockerfile ./Dockerfile
        
        # Build using Cloud Build with async flag to avoid log streaming issues
        echo "Building Docker image using Cloud Build..."
        BUILD_ID=$(gcloud builds submit --tag $IMAGE_NAME . --async --format="value(id)")
        
        # Wait for build to complete with polling
        echo "Waiting for build $BUILD_ID to complete..."
        while true; do
          BUILD_STATUS=$(gcloud builds describe $BUILD_ID --format="value(status)")
          if [ "$BUILD_STATUS" = "SUCCESS" ]; then
            echo "✅ Build completed successfully"
            break
          elif [ "$BUILD_STATUS" = "FAILURE" ] || [ "$BUILD_STATUS" = "CANCELLED" ] || [ "$BUILD_STATUS" = "TIMEOUT" ]; then
            echo "❌ Build failed with status: $BUILD_STATUS"
            echo "📋 Build logs: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$GCP_PROJECT_ID"
            exit 1
          else
            echo "⏳ Build status: $BUILD_STATUS (waiting...)"
            sleep 10
          fi
        done
        
        # Clean up
        rm ./Dockerfile
        
        # Deploy to Cloud Run with two-step approach like deploy.sh
        echo "Deploying to Cloud Run..."
        URL=$(gcloud run deploy $SERVICE_NAME \
          --image $IMAGE_NAME \
          --platform managed --region $GCP_REGION \
          --allow-unauthenticated --max-instances=1 \
          --format='value(status.url)')
        
        # Update with environment variables
        gcloud run services update $SERVICE_NAME \
          --platform managed --region $GCP_REGION \
          --set-env-vars PUBLIC_BASE_URL=$URL \
          --update-annotations="prometheus.io/scrape=true,prometheus.io/path=/__metrics__,prometheus.io/port=8080"
        
        echo "Deployment complete! Service URL: $URL"
        echo "SERVICE_URL=$URL" >> $GITHUB_ENV
    
    - name: Verify Deployment
      run: |
        echo "Verifying deployment health..."
        echo "Service URL: $SERVICE_URL"
        
        # Wait a moment for service to start
        sleep 10
        
        # Check health endpoint
        HEALTH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/__health__")
        if [ "$HEALTH_RESPONSE" = "200" ]; then
          echo "✅ Health check passed"
        else
          echo "❌ Health check failed (HTTP $HEALTH_RESPONSE)"
          exit 1
        fi
        
        # Check metrics endpoint
        METRICS_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/__metrics__")
        if [ "$METRICS_RESPONSE" = "200" ]; then
          echo "✅ Metrics endpoint working"
        else
          echo "❌ Metrics endpoint check failed (HTTP $METRICS_RESPONSE)"
          # Don't fail the workflow for metrics, just warn
        fi
        
        echo "🔗 Deployment URLs:"
        echo "   • Service: $SERVICE_URL"
        echo "   • Health: $SERVICE_URL/__health__"
        echo "   • Metrics: $SERVICE_URL/__metrics__"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}
    
    - name: Configure Docker for GCR
      run: gcloud auth configure-docker --quiet
    
    - name: Deploy to Staging
      run: |
        STAGING_SERVICE="tunnel-server-staging-pr-${{ github.event.number }}"
        STAGING_IMAGE="gcr.io/$GCP_PROJECT_ID/tunnel-server-staging-pr-${{ github.event.number }}"
        
        echo "Deploying to staging environment: $STAGING_SERVICE"
        
        # Copy Dockerfile to root for Cloud Build context
        cp server/Dockerfile ./Dockerfile
        
        # Build using Cloud Build with async flag to avoid log streaming issues
        BUILD_ID=$(gcloud builds submit --tag $STAGING_IMAGE . --async --format="value(id)")
        
        # Wait for build to complete with polling
        echo "Waiting for build $BUILD_ID to complete..."
        while true; do
          BUILD_STATUS=$(gcloud builds describe $BUILD_ID --format="value(status)")
          if [ "$BUILD_STATUS" = "SUCCESS" ]; then
            echo "✅ Build completed successfully"
            break
          elif [ "$BUILD_STATUS" = "FAILURE" ] || [ "$BUILD_STATUS" = "CANCELLED" ] || [ "$BUILD_STATUS" = "TIMEOUT" ]; then
            echo "❌ Build failed with status: $BUILD_STATUS"
            echo "📋 Build logs: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$GCP_PROJECT_ID"
            exit 1
          else
            echo "⏳ Build status: $BUILD_STATUS (waiting...)"
            sleep 10
          fi
        done
        
        # Clean up
        rm ./Dockerfile
        
        # Deploy to staging Cloud Run service
        STAGING_URL=$(gcloud run deploy $STAGING_SERVICE \
          --image $STAGING_IMAGE \
          --platform managed --region $GCP_REGION \
          --allow-unauthenticated --max-instances=1 \
          --format='value(status.url)')
        
        # Update with environment variables
        gcloud run services update $STAGING_SERVICE \
          --platform managed --region $GCP_REGION \
          --set-env-vars PUBLIC_BASE_URL=$STAGING_URL \
          --update-annotations="prometheus.io/scrape=true,prometheus.io/path=/__metrics__,prometheus.io/port=8080"
        
        echo "Staging deployment complete! URL: $STAGING_URL"
        echo "STAGING_URL=$STAGING_URL" >> $GITHUB_ENV
    
    - name: Comment PR with staging URL
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 🚀 Staging Deployment Ready

          Your PR has been deployed to a staging environment:

          **🔗 Staging URL:** ${{ env.STAGING_URL }}
          **🏥 Health Check:** ${{ env.STAGING_URL }}/__health__
          **📊 Metrics:** ${{ env.STAGING_URL }}/__metrics__

          The staging service will be automatically cleaned up when the PR is merged or closed.
          `
          })

  cleanup-staging:
    name: Cleanup Staging
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && github.event_name == 'pull_request'
    
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}
    
    - name: Delete staging service
      run: |
        STAGING_SERVICE="tunnel-server-staging-pr-${{ github.event.number }}"
        
        # Delete Cloud Run service
        gcloud run services delete $STAGING_SERVICE \
          --platform managed --region $GCP_REGION \
          --quiet || echo "Service may not exist"
        
        # Delete container image
        gcloud artifacts docker images delete \
          gcr.io/$GCP_PROJECT_ID/tunnel-server-staging-pr-${{ github.event.number }} \
          --quiet || echo "Image may not exist"
        
        echo "Staging environment cleaned up"